<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Left Glute Activation</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { flex: 0 0 auto; padding: 0.75rem 1rem; background: #0f172a; color: #fff; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  header h1 { font-size: 1rem; font-weight: 600; }
  header .progress { font-size: 0.875rem; font-weight: 500; color: #94a3b8; background: rgba(255,255,255,0.08); padding: 0.25rem 0.6rem; border-radius: 999px; }
  .slider { flex: 1 1 auto; overflow: hidden; position: relative; touch-action: pan-y; }
  .track { display: flex; height: 100%; transition: transform 0.3s ease-out; will-change: transform; }
  .slide { flex: 0 0 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem 1rem 5rem 1rem; }
  .slide h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; line-height: 1.2; }
  .slide .prescription { font-size: 1rem; color: #475569; font-weight: 500; margin-bottom: 1rem; }
  .slide img { width: 100%; max-height: 220px; object-fit: contain; background: #fff; border-radius: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1rem; }
  .timer-card { background: #fff; border-radius: 1rem; padding: 1.25rem 1rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
  .timer-display { font-size: 4.5rem; font-weight: 800; line-height: 1; color: #0f172a; font-variant-numeric: tabular-nums; margin: 0.5rem 0 1rem 0; transition: color 0.2s; }
  .timer-display.counting { color: #2563eb; }
  .timer-display.resting { color: #ea580c; font-size: 3rem; }
  .timer-display.done { color: #16a34a; }
  .timer-btn { width: 100%; padding: 1rem; background: #2563eb; color: #fff; border: none; border-radius: 0.75rem; font-size: 1.0625rem; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.15s, transform 0.05s; }
  .timer-btn:active { transform: scale(0.98); }
  .timer-btn.running { background: #ef4444; }
  .timer-btn.resting { background: #ea580c; }
  .timer-btn.done { background: #16a34a; }
  .set-progress { display: flex; justify-content: center; gap: 0.4rem; margin-top: 1rem; flex-wrap: wrap; }
  .set-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #e2e8f0; transition: background 0.2s; }
  .set-dot.done { background: #16a34a; }
  .set-dot.active { background: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
  .set-label { font-size: 0.875rem; color: #64748b; margin-top: 0.5rem; }
  .reps-card { background: #fff; border-radius: 1rem; padding: 1.25rem 1rem; margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); text-align: center; }
  .reps-card .big-num { font-size: 4rem; font-weight: 800; line-height: 1; color: #0f172a; }
  .reps-card .big-num-label { color: #64748b; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.5rem; }
  .info { background: #fff; border-radius: 1rem; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1rem; }
  .info p { margin-bottom: 0.65rem; line-height: 1.5; font-size: 0.95rem; }
  .info p:last-child { margin-bottom: 0; }
  .info strong { color: #0f172a; }
  .info .cue { color: #1e40af; }
  .info .watch { color: #b91c1c; }
  .video-section { background: #fff; border-radius: 1rem; padding: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 1rem; }
  .video-section .video-label { font-size: 0.8125rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 0.5rem; padding: 0 0.25rem; }
  .video-section .video-wrap { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.5rem; background: #000; }
  .video-section iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .video-card { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border-radius: 0.625rem; color: #fff; text-decoration: none; min-height: 70px; }
  .video-card:active { opacity: 0.85; }
  .video-card .play-icon { flex: 0 0 auto; width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
  .video-card .play-text { flex: 1 1 auto; }
  .video-card .play-text .pt-title { font-weight: 700; font-size: 0.9375rem; }
  .video-card .play-text .pt-sub { font-size: 0.8125rem; opacity: 0.85; margin-top: 0.125rem; }
  nav { flex: 0 0 auto; padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom)) 1rem; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
  nav button { flex: 1; padding: 0.75rem; background: #f1f5f9; border: none; border-radius: 0.5rem; font-size: 0.9375rem; font-weight: 600; color: #0f172a; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  nav button:active:not(:disabled) { background: #e2e8f0; }
  .dots { display: flex; gap: 0.3rem; align-items: center; }
  .nav-dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; background: #cbd5e1; }
  .nav-dot.active { background: #0f172a; transform: scale(1.4); }
  .slide.done { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  .slide.done .emoji { font-size: 5rem; margin-bottom: 1rem; }
  .slide.done h2 { font-size: 1.75rem; margin-bottom: 0.5rem; }
  .slide.done p { color: #475569; margin-bottom: 1.5rem; line-height: 1.5; max-width: 320px; }
  .slide.done button { padding: 1rem 2rem; background: #16a34a; color: #fff; border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Left Glute Activation</h1>
  <div class="progress" id="progress">1 / 7</div>
</header>
<div class="slider" id="slider"><div class="track" id="track"></div></div>
<nav>
  <button id="prev">← Prev</button>
  <div class="dots" id="dots"></div>
  <button id="next">Next →</button>
</nav>
<script>
const exercises = [{"num": 1, "title": "Posterior Pelvic Tilt Reset", "img": null, "videoId": "u0AJnVg0tcc", "search": "posterior+pelvic+tilt+supine+exercise+physio", "prescription": "10s hold × 2", "type": "timer", "duration": 10, "sets": 2, "setLabels": ["Hold 1", "Hold 2"], "setup": "Lie on back, knees bent, feet flat hip-width.", "do": "Flatten the low back completely into the floor. Hold 10s. Release. ×2.", "cue": "This is the APT reset. Every exercise below starts from this awareness - do it first, always.", "watch": "On rest days, do this before you even get out of bed."}, {"num": 2, "title": "Left Glute Isometric Heel Press", "img": null, "videoId": "SKKxhCgQ7hM", "search": "glute+isometric+heel+press+supine+activation", "prescription": "20s hold × 3", "type": "timer", "duration": 20, "sets": 3, "setLabels": ["Set 1", "Set 2", "Set 3"], "setup": "Lie on back, knees bent, LEFT foot flat. Hand under your left glute.", "do": "Drive the LEFT heel down into the floor hard. No hip lift - pure isometric. Hold 20s.", "cue": "The hand under your glute is not optional - it is how you know the glute fired and not the hamstring.", "watch": "Only feel hamstring? Reset, squeeze the glute FIRST, then press the heel. Do not substitute."}, {"num": 3, "title": "Left Clamshell with Band", "img": null, "videoId": "39vuP5xozsI", "search": "banded+clamshell+glute+medius+exercise+form", "prescription": "15 reps × 3 sets", "type": "reps", "bigNum": 15, "bigNumLabel": "Reps × 3 sets", "setup": "Band above the knees. Lie on your RIGHT side, hips at 45°, knees at 90°.", "do": "Tuck the pelvis to PPT BEFORE opening. Open the top knee fully. 2s pause at the top, 3s to close. ×15.", "cue": "Pelvis stays stacked. If you roll backward to get more range, you have left the glute behind.", "watch": "Range follows control, never the other way round."}, {"num": 4, "title": "Left Hip Abduction with Internal Rotation", "img": null, "videoId": "g9FtnmsIYgI", "search": "side+lying+hip+abduction+internal+rotation+gluteus+medius", "prescription": "12 reps × 2 sets", "type": "reps", "bigNum": 12, "bigNumLabel": "Reps × 2 sets", "setup": "No band. Lie on your RIGHT side, left leg stacked on top, body in a straight line.", "do": "Rotate the left leg inward - toes tilt slightly toward the floor - BEFORE you lift. Hold 2s at the top. Slow lower. ×12.", "cue": "Toes down before you lift. That single detail is what makes this glute med instead of TFL.", "watch": "A small clean range beats a big sloppy one. Do not let the pelvis roll back.", "start": 12}, {"num": 5, "title": "Prone Glute Squeeze with Heel Drive", "img": null, "videoId": "5xus2LVCSx8", "search": "prone+hip+extension+glute+activation+exercise", "prescription": "12 reps × 3 sets", "type": "reps", "bigNum": 12, "bigNumLabel": "Reps × 3 sets", "setup": "Lie face down, forehead on your hands, legs straight.", "do": "Squeeze the LEFT glute, THEN lift the left heel 5-10cm toward the ceiling. Pause 2s. Lower. ×12.", "cue": "Glute squeezes first, then the heel moves. Isolates glute max with zero hip flexor involvement.", "watch": "If your low back arches, you lifted too high. 5-10cm is the whole movement."}, {"num": 6, "title": "Left Single-Leg Bridge", "img": null, "videoId": "AVAXhy6pl7o", "search": "single+leg+glute+bridge+correct+form+physio", "prescription": "10 reps × 3s hold × 3 sets", "type": "reps", "bigNum": 10, "bigNumLabel": "Reps × 3 sets", "setup": "On your back, both feet down. Keep the LEFT foot CLOSE to your butt - short lever.", "do": "Tuck the pelvis, drive the hips up, then lift the RIGHT foot so only the left is in contact. Hold 3s. Lower. ×10.", "cue": "This is the one the two-legged bridge cannot replace - the left glute cannot hide behind the right.", "watch": "Feel hamstring not glute? Right foot back down, reset the squeeze, retry. Keep that left foot CLOSE - a far foot loads the hamstring and the sciatic nerve."}, {"num": 7, "title": "Left Standing Glute Isometric", "img": null, "videoId": "YYqFfdanScQ", "search": "standing+glute+squeeze+isometric+weight+bearing+activation", "prescription": "20s hold × 2", "type": "timer", "duration": 20, "sets": 2, "setLabels": ["Hold 1", "Hold 2"], "setup": "Stand, weight shifted slightly onto the LEFT leg. Fingertips on a wall for balance only.", "do": "Squeeze the left glute as hard as you can without moving. Hold 20s.", "cue": "Trains the glute to fire while weight-bearing - which is exactly what it has to do at foot-strike.", "watch": "Fingertips only. If you are gripping the wall, shift less weight onto the left."}];
const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const progressEl = document.getElementById('progress');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const slider = document.getElementById('slider');
let currentIndex = 0;
const REST_SECONDS = 5;
const TRANSITION_SECONDS = 8;
// 1 and 2 are both supine timers back to back, so they run hands-free.
// Everything after that is either a rep count or a position change (side-lying,
// prone, standing), which needs a deliberate tap. Only timer exercises can chain.
const AUTO_CHAIN = [1, 2];
const autoAdvances = (num) => AUTO_CHAIN.includes(num) && num !== AUTO_CHAIN[AUTO_CHAIN.length - 1];

let pendingAdvance = null;
function cancelPendingAdvance() {
  if (!pendingAdvance) return;
  clearInterval(pendingAdvance.interval);
  pendingAdvance = null;
}

function buildSlide(ex, i) {
  const slide = document.createElement('section');
  slide.className = 'slide';
  slide.dataset.index = i;
  let interactive = '';
  if (ex.type === 'timer') {
    const dots = Array.from({length: ex.sets}, (_, k) => `<div class="set-dot" data-set="${k}"></div>`).join('');
    interactive = `
      <div class="timer-card">
        <div class="set-label" id="setLabel-${i}">Set 1 of ${ex.sets}${ex.setLabels ? ' - ' + ex.setLabels[0] : ''}</div>
        <div class="timer-display" id="timer-${i}">${ex.duration}</div>
        <button class="timer-btn" id="timerBtn-${i}">▶ Start Hold</button>
        <div class="set-progress">${dots}</div>
      </div>`;
  } else {
    interactive = `
      <div class="reps-card">
        <div class="big-num">${ex.bigNum}</div>
        <div class="big-num-label">${ex.bigNumLabel}</div>
      </div>`;
  }
  const imageHtml = ex.img
    ? `<img src="${ex.img}" alt="${ex.title}" loading="lazy">`
    : `<div style="background:#fff;border-radius:0.75rem;padding:1.25rem;text-align:center;color:#64748b;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.06);">Visual: see the demo video below.</div>`;
  const searchUrl = `https://www.youtube.com/results?search_query=${ex.search}`;
  let videoHtml;
  if (ex.videoId) {
    const embedUrl = `https://www.youtube-nocookie.com/embed/${ex.videoId}?rel=0&modestbranding=1&playsinline=1${ex.start ? '&start=' + ex.start : ''}`;
    videoHtml = `
      <div class="video-section">
        <div class="video-label">🎥 Physio's demo</div>
        <div class="video-wrap">
          <iframe src="${embedUrl}" title="${ex.title} demo" loading="lazy"
            allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </div>`;
  } else {
    videoHtml = `
      <a class="video-card" href="${searchUrl}" target="_blank" rel="noopener">
        <span class="play-icon">▶</span>
        <span class="play-text">
          <span class="pt-title">Watch demo on YouTube</span>
          <span class="pt-sub">Opens a search for "${ex.title.toLowerCase()}"</span>
        </span>
      </a>`;
  }
  slide.innerHTML = `
    <h2>${ex.num}. ${ex.title}</h2>
    <div class="prescription">${ex.prescription}</div>
    ${imageHtml}
    ${interactive}
    <div class="info">
      <p><strong>Setup:</strong> ${ex.setup}</p>
      <p><strong>Do:</strong> ${ex.do}</p>
      <p class="cue"><strong>Cue:</strong> ${ex.cue}</p>
      <p class="watch"><strong>Watch:</strong> ${ex.watch}</p>
    </div>
    ${videoHtml}`;
  track.appendChild(slide);
  if (ex.type === 'timer') setupTimer(i, ex);
}

function buildDoneSlide() {
  const slide = document.createElement('section');
  slide.className = 'slide done';
  slide.innerHTML = `<div class="emoji">✅</div><h2>Round complete!</h2><p>Every single day, including rest days. Neurological re-education needs daily stimulus, not intensity. Order matters - do not skip ahead.</p><button id="restart">Start over</button>`;
  track.appendChild(slide);
  slide.querySelector('#restart').addEventListener('click', () => goTo(0));
}
function buildDots() { for (let i = 0; i < exercises.length; i++) { const d = document.createElement('div'); d.className = 'nav-dot'; dotsEl.appendChild(d); } }
function updateUI() {
  const total = exercises.length;
  const onDone = currentIndex >= total;
  track.style.transform = `translateX(-${currentIndex * 100}%)`;
  progressEl.textContent = onDone ? '✓ Done' : `${currentIndex + 1} / ${total}`;
  Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === currentIndex));
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex >= total;
  nextBtn.textContent = currentIndex === total - 1 ? 'Finish →' : 'Next →';
}
function goTo(i) {
  const total = exercises.length;
  cancelPendingAdvance();
  currentIndex = Math.max(0, Math.min(total, i));
  updateUI();
}

const timerState = {};
function setupTimer(i, ex) {
  const needsRest = ex.sets > 1;
  timerState[i] = { running: false, remaining: ex.duration, currentSet: 0, interval: null, phase: 'idle', restTime: REST_SECONDS };
  const display = () => document.getElementById(`timer-${i}`);
  const btn = () => document.getElementById(`timerBtn-${i}`);
  const setLabel = () => document.getElementById(`setLabel-${i}`);
  const dots = () => document.querySelectorAll(`#track .slide[data-index="${i}"] .set-dot`);

  function renderSetState() {
    const st = timerState[i];
    dots().forEach((d, k) => {
      d.classList.remove('done', 'active');
      if (k < st.currentSet) d.classList.add('done');
      else if (k === st.currentSet && st.phase !== 'done') d.classList.add('active');
    });
    const idx = st.currentSet;
    if (idx < ex.sets) {
      const label = ex.setLabels ? ' - ' + ex.setLabels[idx] : '';
      setLabel().textContent = `Set ${idx + 1} of ${ex.sets}${label}`;
    } else {
      setLabel().textContent = `All ${ex.sets} sets complete`;
    }
  }
  renderSetState();

  function setBtn(label, cls) { const b = btn(); b.textContent = label; b.className = 'timer-btn' + (cls ? ' ' + cls : ''); }
  function clearTimerClasses() { display().classList.remove('counting', 'resting', 'done'); }

  function startCountdown() {
    const st = timerState[i];
    st.phase = 'counting'; st.running = true; st.remaining = ex.duration;
    clearTimerClasses(); display().classList.add('counting');
    display().textContent = ex.duration;
    setBtn('⏸ Pause', 'running'); btn().disabled = false;
    st.interval = setInterval(tick, 1000);
  }
  function startRest() {
    const st = timerState[i];
    st.phase = 'resting'; st.restTime = REST_SECONDS; st.running = true;
    clearTimerClasses(); display().classList.add('resting');
    display().textContent = `REST ${st.restTime}`;
    setBtn('Resting...', 'resting'); btn().disabled = true;
    st.interval = setInterval(tick, 1000);
  }
  function tick() {
    const st = timerState[i];
    if (st.phase === 'counting') {
      st.remaining -= 1;
      if (st.remaining > 0) { display().textContent = st.remaining; tickSound(); }
      else {
        clearInterval(st.interval); st.running = false; st.currentSet += 1;
        endHoldSound(); vibrate(); renderSetState();
        if (st.currentSet >= ex.sets) {
          if (autoAdvances(ex.num)) { startTransition(); }
          else { markDone(); }
        } else if (needsRest) { startRest(); }
        else {
          st.phase = 'idle'; st.remaining = ex.duration;
          clearTimerClasses(); display().textContent = ex.duration;
          setBtn('▶ Start Next Set'); btn().disabled = false;
        }
      }
    } else if (st.phase === 'resting') {
      st.restTime -= 1;
      if (st.restTime > 0) { display().textContent = `REST ${st.restTime}`; restTickSound(); }
      else { clearInterval(st.interval); st.running = false; renderSetState(); startCountdown(); endRestSound(); }
    }
  }

  function markDone() {
    const st = timerState[i];
    st.phase = 'done'; st.running = false;
    clearTimerClasses(); display().classList.add('done');
    display().textContent = '✓'; setBtn('✓ Done - Swipe Next', 'done'); btn().disabled = false;
  }

  // Hands-free hop to the next exercise, with a window to reposition.
  function startTransition() {
    const st = timerState[i];
    st.phase = 'transition'; st.running = false; st.transTime = TRANSITION_SECONDS;
    clearTimerClasses(); display().classList.add('resting');
    display().textContent = `NEXT ${st.transTime}`;
    setBtn('✕ Stay here', 'resting'); btn().disabled = false;
    setTimeout(transitionSound, 700); // let the set-finished chime land first
    vibrateTransition();
    const iv = setInterval(() => {
      st.transTime -= 1;
      if (st.transTime > 0) { display().textContent = `NEXT ${st.transTime}`; restTickSound(); return; }
      clearInterval(iv); pendingAdvance = null;
      markDone();
      goTo(i + 1);
      const next = timerState[i + 1];
      if (next && next.begin) next.begin();
    }, 1000);
    pendingAdvance = { interval: iv, index: i };
  }

  // Let the previous exercise start this one when it auto-advances.
  timerState[i].begin = () => {
    const st = timerState[i];
    if (st.interval) clearInterval(st.interval);
    st.currentSet = 0; st.phase = 'idle'; st.running = false;
    renderSetState(); startCountdown();
  };

  btn().addEventListener('click', () => {
    const st = timerState[i];
    if (st.phase === 'transition') { cancelPendingAdvance(); markDone(); return; }
    if (st.phase === 'done') {
      st.currentSet = 0; st.remaining = ex.duration; st.phase = 'idle';
      clearTimerClasses(); display().textContent = ex.duration;
      renderSetState(); setBtn('▶ Start Hold'); return;
    }
    if (st.phase === 'resting') return;
    if (!st.running) { startCountdown(); }
    else {
      st.running = false; clearInterval(st.interval);
      clearTimerClasses(); setBtn('▶ Resume');
    }
  });
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, durSec, gainVal, type) {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = type || 'sine';
    gain.gain.setValueAtTime(gainVal, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + durSec);
    osc.start(); osc.stop(ctx.currentTime + durSec);
  } catch (e) {}
}
// Distinct, louder sounds:
// - tickSound:    sharp HIGH "tick" during work hold (square wave, very short)
// - restTickSound: soft LOW "bong" during rest (sine wave, longer, totally different character)
// - endHoldSound: two-tone "ding-dong" when a set finishes
// - endRestSound: rising two-tone "go!" cue when rest ends + next set starts
function tickSound()     { tone(1800, 0.04, 0.6,  'square'); }
function restTickSound() { tone(330,  0.22, 0.55, 'sine');   }
function endHoldSound()  {
  tone(880, 0.25, 0.7, 'sine');
  setTimeout(() => tone(660, 0.4, 0.7, 'sine'), 200);
}
function endRestSound()  {
  tone(800,  0.15, 0.6, 'sine');
  setTimeout(() => tone(1200, 0.22, 0.6, 'sine'), 110);
}
function transitionSound() {
  tone(587,  0.18, 0.7,  'sine');
  setTimeout(() => tone(784,  0.18, 0.7,  'sine'), 150);
  setTimeout(() => tone(1047, 0.50, 0.75, 'sine'), 300);
}
function vibrate() { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); }
function vibrateTransition() { if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 220]); }

// Screen wake lock - keep iPhone/Android screen ON during the routine.
// Wake Lock API requires a user gesture on iOS Safari (16.4+), so we
// request on every tap; subsequent calls are no-ops if already held.
let wakeLock = null;
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && wakeLock === null) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
document.body.addEventListener('click', acquireWakeLock, { passive: true });
document.body.addEventListener('touchstart', acquireWakeLock, { passive: true });
// Re-acquire when returning from background (lock auto-releases on visibility change)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') acquireWakeLock();
});

let touchStartX = 0, touchStartY = 0, swipeStartTime = 0;
slider.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; swipeStartTime = Date.now();
}, {passive: true});
slider.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const elapsed = Date.now() - swipeStartTime;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && elapsed < 600) {
    if (dx < 0) goTo(currentIndex + 1); else goTo(currentIndex - 1);
  }
}, {passive: true});
prevBtn.addEventListener('click', () => goTo(currentIndex - 1));
nextBtn.addEventListener('click', () => goTo(currentIndex + 1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
  else if (e.key === 'ArrowRight') goTo(currentIndex + 1);
});
exercises.forEach((ex, i) => buildSlide(ex, i));
buildDoneSlide(); buildDots(); updateUI();
</script>
