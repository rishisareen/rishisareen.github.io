<title>Pre-Run Minimum</title>

:root {
  --bg: #f8fafc; --surface: #ffffff; --ink: #0f172a; --soft: #475569; --muted: #64748b; --line: #e2e8f0; --chip: #f1f5f9;
  --accent: #2563eb; --accent-ring: rgba(37,99,235,0.22); --cue: #1e40af; --warn: #b91c1c; --rest: #ea580c; --ok: #16a34a;

  --plate: #ffffff; --why-bg: #fff7ed; --why-ink: #9a3412; --video-a: #ef4444; --video-b: #dc2626; --shadow: rgba(15,23,42,0.07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #141d2f; --ink: #e5e9f0; --soft: #b4bfd0; --muted: #8b98ad; --line: #26334b; --chip: #1d2840;
  --accent: #3b82f6; --accent-ring: rgba(59,130,246,0.3); --cue: #93c5fd; --warn: #fca5a5; --rest: #fb923c; --ok: #22c55e;
  --bar: #020617; --bar-ink: #f1f5f9; --bar-muted: #94a3b8; --bar-chip: rgba(255,255,255,0.1);
  --plate: #f1f5f9; --why-bg: #2a1a0e; --why-ink: #fdba74; --video-a: #dc2626; --video-b: #b91c1c; --shadow: rgba(0,0,0,0.35);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #141d2f; --ink: #e5e9f0; --soft: #b4bfd0; --muted: #8b98ad; --line: #26334b; --chip: #1d2840;
  --accent: #3b82f6; --accent-ring: rgba(59,130,246,0.3); --cue: #93c5fd; --warn: #fca5a5; --rest: #fb923c; --ok: #22c55e;
  --bar: #020617; --bar-ink: #f1f5f9; --bar-muted: #94a3b8; --bar-chip: rgba(255,255,255,0.1);
  --plate: #f1f5f9; --why-bg: #2a1a0e; --why-ink: #fdba74; --video-a: #dc2626; --video-b: #b91c1c; --shadow: rgba(0,0,0,0.35);
  color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding-block: 0.75rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); color: var(--bar-ink); }
header h1 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: 0.01em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-right { display: flex; align-items: center; gap: 0.45rem; flex: 0 0 auto; }
.swap { font-size: 0.72rem; font-weight: 600; color: var(--bar-ink); background: var(--bar-chip); padding: 0.3rem 0.6rem; border-radius: 999px; text-decoration: none; }
.progress { font-size: 0.85rem; font-weight: 600; color: var(--bar-muted); background: var(--bar-chip); padding: 0.25rem 0.6rem; border-radius: 999px; font-variant-numeric: tabular-nums; }
.slider { flex: 1 1 auto; overflow: hidden; position: relative; touch-action: pan-y; }
.track { display: flex; height: 100%; transition: transform 0.3s ease-out; will-change: transform; }
.slide { flex: 0 0 100%; height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 1rem 1.5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.slide-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.85rem; }
.why { margin: 0; background: var(--why-bg); color: var(--why-ink); border-radius: 0.75rem; padding: 0.7rem 0.85rem; font-size: 0.88rem; line-height: 1.45; font-weight: 500; }
.slide h2 { margin: 0; font-size: 1.45rem; line-height: 1.2; text-wrap: balance; }
.prescription { margin: -0.5rem 0 0; color: var(--soft); font-weight: 600; font-size: 0.98rem; }
.plate { background: var(--plate); border-radius: 0.85rem; box-shadow: 0 1px 4px var(--shadow); padding: 0.35rem; }
.plate img { display: block; width: 100%; max-width: 100%; height: auto; }
.card { background: var(--surface); border-radius: 1rem; box-shadow: 0 1px 4px var(--shadow); padding: 1.1rem 1rem; }
.center { text-align: center; }
.big-num { font-size: 4rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.big-num-label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 0.45rem; font-weight: 600; }
.set-label { font-size: 0.875rem; color: var(--muted); }
.timer-display { font-size: 4.5rem; font-weight: 800; line-height: 1; margin: 0.5rem 0 1rem; font-variant-numeric: tabular-nums; transition: color 0.2s; }
.timer-display.counting { color: var(--accent); }
.timer-display.resting { color: var(--rest); font-size: 3rem; }
.timer-display.done { color: var(--ok); }
.timer-btn { width: 100%; padding: 1rem; border: none; border-radius: 0.75rem; background: var(--accent); color: #ffffff; font-size: 1.05rem; font-weight: 650; cursor: pointer; }
.timer-btn:active { transform: scale(0.985); }
.timer-btn.running { background: #ef4444; }
.timer-btn.resting { background: var(--rest); }
.timer-btn.done { background: var(--ok); }
.timer-btn:disabled { cursor: default; }
.set-progress { display: flex; justify-content: center; gap: 0.45rem; margin-top: 1rem; }
.set-dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--line); }
.set-dot.done { background: var(--ok); }
.set-dot.active { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.info p { margin: 0 0 0.65rem; line-height: 1.5; font-size: 0.95rem; }
.info p:last-child { margin-bottom: 0; }
.info .cue { color: var(--cue); }
.info .watch { color: var(--warn); }
.video-card { display: flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1rem; border-radius: 0.75rem; color: #ffffff; text-decoration: none; background: linear-gradient(135deg, var(--video-a), var(--video-b)); }
.video-card .play { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.2); display: grid; place-items: center; font-size: 1.1rem; }
.video-card .vt { font-weight: 700; font-size: 0.94rem; }
.video-card .vs { font-size: 0.8rem; opacity: 0.9; margin-top: 0.1rem; }
.slide.done .slide-inner { min-height: 100%; justify-content: center; align-items: center; text-align: center; }
.done-mark { font-size: 3.5rem; font-weight: 800; color: var(--ok); line-height: 1; }
.slide.done h2 { font-size: 1.7rem; }
.next-steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.5rem; text-align: left; width: 100%; max-width: 340px; }
.next-steps li { background: var(--surface); border-radius: 0.75rem; box-shadow: 0 1px 4px var(--shadow); padding: 0.7rem 0.85rem; font-size: 0.95rem; line-height: 1.4; }
.next-steps b { color: var(--accent); margin-right: 0.35rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
.btn-primary { padding: 0.95rem 1.6rem; border: none; border-radius: 0.75rem; background: var(--ok); color: #ffffff; font-size: 1rem; font-weight: 650; cursor: pointer; }
.btn-ghost { padding: 0.95rem 1.4rem; border-radius: 0.75rem; background: var(--chip); color: var(--ink); font-size: 0.95rem; font-weight: 650; text-decoration: none; }
nav { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; background: var(--surface); box-shadow: 0 -2px 8px var(--shadow); padding-top: 0.6rem; padding-bottom: calc(0.6rem + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav button { flex: 1; padding: 0.75rem; border: none; border-radius: 0.55rem; background: var(--chip); color: var(--ink); font-size: 0.95rem; font-weight: 650; cursor: pointer; }
nav button:disabled { opacity: 0.4; cursor: default; }
.dots { display: flex; gap: 0.35rem; align-items: center; }
.nav-dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--line); }
.nav-dot.active { background: var(--ink); transform: scale(1.35); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .track, .timer-display { transition: none; } }
</style>
</head>

function buildSlide(ex, i) {
  const s = document.createElement('section');
  s.className = 'slide'; s.dataset.index = i;
  const interactive = ex.type === 'timer'
    ? `<div class="card center"><div class="set-label">Set 1 of ${ex.sets}</div><div class="timer-display">${ex.duration}</div>
       <button class="timer-btn" type="button">▶ Start hold</button>
       <div class="set-progress">${Array.from({length: ex.sets}, () => '<div class="set-dot"></div>').join('')}</div></div>`
    : `<div class="card center"><div class="big-num">${ex.bigNum}</div><div class="big-num-label">${ex.bigNumLabel}</div></div>`;
  s.innerHTML = `<div class="slide-inner">
    ${i === 0 ? `<p class="why">${WHY}</p>` : ''}
    <h2>${ex.num}. ${ex.title}</h2>
    <p class="prescription">${ex.prescription}</p>
    <div class="plate"><img src="${ex.img}" alt="${ex.title}: ${ex.do}"></div>
    ${interactive}
    <div class="card info">
      <p><strong>Setup:</strong> ${ex.setup}</p>
      <p><strong>Do:</strong> ${ex.do}</p>
      <p class="cue"><strong>Cue:</strong> ${ex.cue}</p>
      <p class="watch"><strong>Watch:</strong> ${ex.watch}</p>
    </div>
    <a class="video-card" href="${ex.video}" target="_blank" rel="noopener">
      <span class="play">▶</span><span><div class="vt">${ex.videoTitle}</div><div class="vs">${ex.videoSub}</div></span>
    </a></div>`;
  track.appendChild(s);
  if (ex.type === 'timer') setupTimer(s, ex, i);
}

// Sound and vibration: audio unlocks on the first tap, as browsers require.
let actx = null;
function unlockAudio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); }
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, dur, vol) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const tickSound = () => tone(1000, 0.05, 0.15);
const restTickSound = () => tone(600, 0.05, 0.12);
const endHoldSound = () => { tone(880, 0.25, 0.6); setTimeout(() => tone(660, 0.4, 0.6), 200); };
const endRestSound = () => { tone(587, 0.18, 0.6); setTimeout(() => tone(784, 0.18, 0.6), 150); setTimeout(() => tone(1047, 0.45, 0.65), 300); };
function vibrate() { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} }

// Keep the screen awake once the routine has started.
let wakeLock = null, wakeWanted = false;
async function requestWake() {
  wakeWanted = true;
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeWanted) requestWake(); });
document.addEventListener('pointerdown', () => { unlockAudio(); requestWake(); }, { once: true });

function setupTimer(slide, ex) {
  const disp = slide.querySelector('.timer-display'), btn = slide.querySelector('.timer-btn');
  const label = slide.querySelector('.set-label'), dots = [...slide.querySelectorAll('.set-dot')];
  const st = { phase: 'idle', set: 0, left: ex.duration, iv: null };
  const stop = () => { clearInterval(st.iv); st.iv = null; };
  const setDisp = (t, c) => { disp.textContent = t; disp.className = 'timer-display' + (c ? ' ' + c : ''); };
  const setBtn = (t, c, off) => { btn.textContent = t; btn.className = 'timer-btn' + (c ? ' ' + c : ''); btn.disabled = !!off; };
  function render() {
    dots.forEach((d, k) => { d.className = 'set-dot' + (k < st.set ? ' done' : (k === st.set && st.phase !== 'done' ? ' active' : '')); });
    label.textContent = st.set < ex.sets ? `Set ${st.set + 1} of ${ex.sets}` : `All ${ex.sets} sets complete`;
  }
  function count() {
    st.phase = 'counting'; setDisp(st.left, 'counting'); setBtn('⏸ Pause', 'running'); stop();
    st.iv = setInterval(() => {
      st.left -= 1;
      if (st.left > 0) { setDisp(st.left, 'counting'); tickSound(); return; }
      stop(); st.set += 1; endHoldSound(); vibrate(); render();
      if (st.set >= ex.sets) { st.phase = 'done'; setDisp('✓', 'done'); setBtn('✓ Done · Next', 'done'); }
      else rest();
    }, 1000);
  }
  function rest() {
    st.phase = 'resting'; let r = REST_SECONDS; setDisp(`REST ${r}`, 'resting'); setBtn('Resting…', 'resting', true);
    st.iv = setInterval(() => {
      r -= 1;
      if (r > 0) { setDisp(`REST ${r}`, 'resting'); restTickSound(); return; }
      stop(); st.left = ex.duration; render(); endRestSound(); count();
    }, 1000);
  }
  btn.addEventListener('click', () => {
    unlockAudio(); requestWake();
    if (st.phase === 'idle') { st.left = ex.duration; count(); }
    else if (st.phase === 'counting') { stop(); st.phase = 'paused'; setBtn('▶ Resume'); }
    else if (st.phase === 'paused') count();
    else if (st.phase === 'done') goTo(current + 1);
  });
  render();
}

function updateUI() {
  const total = exercises.length, onDone = current >= total;
  track.style.transform = `translateX(-${current * 100}%)`;
  progressEl.textContent = onDone ? '✓ Done' : `${current + 1} / ${total}`;
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('active', k === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = onDone;
  nextBtn.textContent = current === total - 1 ? 'Finish →' : 'Next →';
}
function goTo(i) { current = Math.max(0, Math.min(exercises.length, i)); updateUI(); }

document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') goTo(current + 1); if (e.key === 'ArrowLeft') goTo(current - 1); });
let sx = null, sy = null;
slider.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
slider.addEventListener('touchend', (e) => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) goTo(current + (dx < 0 ? 1 : -1));
  sx = null;
}, { passive: true });
updateUI();
</script>
</body>
</html>
